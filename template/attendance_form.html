<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Class attendance</title>
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
</head>
<body>

<div class="container py-4" style="max-width: 32em">
    <h1 class="h3 mb-4">Check in to class</h1>

    <form method="POST" action="{{ url_for('attendance_checkin', key=key) }}">
        {% if slots|length > 1 %}
        <div class="mb-3">
            <label class="form-label">Which class are you attending?</label>
            {% for slot in slots %}
            <div class="form-check">
                <input class="form-check-input" type="radio" name="slot_id"
                       id="slot_{{ loop.index }}" value="{{ slot.slot_id }}"
                       {% if loop.first %}checked{% endif %} required>
                <label class="form-check-label" for="slot_{{ loop.index }}">
                    {{ slot.label }}
                </label>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <input type="hidden" name="slot_id" value="{{ slots[0].slot_id }}">
        <p class="text-muted">{{ slots[0].label }}</p>
        {% endif %}

        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name"
                   value="{{ name }}" autocomplete="name" required>
        </div>

        <div class="mb-3">
            <label for="login" class="form-label">SIS login / UKČO</label>
            <input type="text" class="form-control" id="login" name="login"
                   value="{{ login }}" autocapitalize="none"
                   autocomplete="username" required>
            <div class="form-text">
                Your details are remembered in this browser for next time.
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100">Confirm</button>
    </form>
</div>

</body>
</html>
